[pytest]
testpaths = tests
addopts = -ra
# Tiers (#274): `slow` marks the files whose tests take over a second each
# on average (or any test over 2 s). A fast run is `-m "not slow"`; the full
# run (no -m) is what CI and a release use.
markers =
    slow: over a second per test on average; left out of a fast run with -m "not slow"
# Known deprecations in the app and its libraries (FastAPI on_event,
# datetime.utcnow); they don't affect behavior and would bury real output.
filterwarnings =
    ignore::DeprecationWarning
