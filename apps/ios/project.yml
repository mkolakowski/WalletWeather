# The Xcode project is generated from this file with XcodeGen
# (`cd apps/ios && xcodegen generate`); both are committed, so Xcode opens
# the project without it. Change this file, not the project, then generate.
name: WalletWeather
options:
  bundleIdPrefix: net.iptater
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # The iOS app's version (CHANGELOG.md tracks it beside the app, web and
    # schema versions). Keep AppInfo.version in WalletWeatherKit equal to it.
    MARKETING_VERSION: "0.65.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # iPhone only for now (decided 2026-11-14): no iPad, no Mac.
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

packages:
  WalletWeatherKit:
    path: WalletWeatherKit

targets:
  WalletWeather:
    type: application
    platform: iOS
    sources:
      - path: WalletWeather
      # The widgets' faces, for the Debug gallery (WW_DEBUG_WIDGETS, #318).
      - path: Widgets/Views.swift
    dependencies:
      - package: WalletWeatherKit
      # The widgets (#318), embedded in the app.
      - target: WalletWeatherWidgets
      # A reminder's expanded view (#319).
      - target: WalletWeatherNotifications
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: WalletWeather
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # A second WalletWeather window, beside the first on the Duo's inner
        # screen (#90).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # All four: App Store Connect refuses an app with more than one
        # window (the Duo's side by side, above) without upside-down too.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # walletweather://: the sign-in sheet's answer and the "Open in
        # WalletWeather" button in the web app's Settings (WalletWeatherKit's AppLink).
        CFBundleURLTypes:
          - CFBundleURLName: net.iptater.walletweather
            CFBundleURLSchemes: [walletweather]
        # A bank's CSV in Files, Mail or a share sheet's Open in… offers
        # WalletWeather (#326): a Viewer at Alternate rank, since the app
        # imports a copy and edits no CSV. Not in place: it reads a copy.
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
        LSSupportsOpeningDocumentsInPlace: false
        # Plain http:// for home-network addresses only (ServerAddress):
        # iOS's own local-networking exception, nothing wider.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: WalletWeather connects to your WalletWeather server when it's on your home network.
        ITSAppUsesNonExemptEncryption: false
        # The app lock (#91), when turned on in More.
        NSFaceIDUsageDescription: "WalletWeather uses Face ID to unlock the app when you turn its lock on."
        # Scanning the web app's QR code to sign in (#100), only when chosen.
        # Sync with iCloud in the background (#238): CloudKit's silent pushes.
        # Bank sync on a phone without a server (#239): background app refresh.
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [net.iptater.walletweather.banksync]
        # The backups folder shows in the Files app under iCloud Drive (#237).
        NSUbiquitousContainers:
          iCloud.net.iptater.walletweather:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: WalletWeather
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSCameraUsageDescription: "WalletWeather uses the camera to scan the sign-in QR code from your WalletWeather server's Settings, only when you choose to."
        # A line dragged onto a Calendar day, between WalletWeather's own
        # windows (#308; WalletWeatherKit's LineDrag). Never rename it.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: net.iptater.walletweather.line
            UTTypeDescription: WalletWeather line
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
    # The scheme the builds and Scripts/testflight.sh use, kept in the
    # project (xcshareddata) so it doesn't depend on Xcode making one.
    scheme: {}
    # iCloud Drive (#237): the backup of the household on this iPhone goes to
    # this container's Backups folder. Xcode registers the container with the
    # team the first time it signs the app with this capability.
    entitlements:
      path: WalletWeather/WalletWeather.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.net.iptater.walletweather]
        com.apple.developer.icloud-services: [CloudDocuments, CloudKit]
        # Sync with iCloud (#238): CloudKit's silent pushes, also in the background.
        aps-environment: development
        com.apple.developer.ubiquity-container-identifiers: [iCloud.net.iptater.walletweather]
        # Custom themes (#297): names and colours only, in the iCloud key-value store.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # The group the widgets read each connection's summary from (#318).
        # Stable: never rename it. Xcode registers it with the team the first
        # time it signs the app with it.
        com.apple.security.application-groups: [group.net.iptater.walletweather]
    settings:
      base:
        # The bundle ID is what keeps the phone's Keychain sign-in: never change it.
        PRODUCT_BUNDLE_IDENTIFIER: net.iptater.walletweather
        PRODUCT_NAME: WalletWeather
        # The app icon (#156), with dark and tinted versions.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  # The widgets (Plans/outside-the-app.md, phase 1, #318): Balance, Next
  # bills and To confirm, read from the summary the app writes into the app
  # group. They never reach a server.
  WalletWeatherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: WalletWeatherKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: WalletWeather
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/WalletWeatherWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iptater.walletweather]
    settings:
      base:
        # Stable: the widgets people have added are kept under it.
        PRODUCT_BUNDLE_IDENTIFIER: net.iptater.walletweather.widgets
        PRODUCT_NAME: WalletWeatherWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # WidgetKit and App Intents call in from any thread.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  # A reminder's expanded view (Plans/outside-the-app.md, phase 2, #319):
  # the amount the reminder is about, read from the summary in the app group,
  # or •••• while the phone or the app is locked.
  WalletWeatherNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: Notifications
    dependencies:
      - package: WalletWeatherKit
      - sdk: UserNotificationsUI.framework
    info:
      path: Support/Notifications-Info.plist
      properties:
        CFBundleDisplayName: WalletWeather
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            # Stable: the reminders' category (WalletWeatherKit's ReminderPlan).
            UNNotificationExtensionCategory: net.iptater.walletweather.reminder
            UNNotificationExtensionInitialContentSizeRatio: 0.25
            UNNotificationExtensionDefaultContentHidden: false
    entitlements:
      path: Notifications/WalletWeatherNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iptater.walletweather]
    settings:
      base:
        # Stable.
        PRODUCT_BUNDLE_IDENTIFIER: net.iptater.walletweather.notifications
        PRODUCT_NAME: WalletWeatherNotifications
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
