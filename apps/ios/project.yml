# The Xcode project is generated from this file with XcodeGen
# (`cd apps/ios && xcodegen generate`); both are committed, so Xcode opens
# the project without it. Change this file, not the project, then generate.
name: WalletWeather
options:
  bundleIdPrefix: net.iptater
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # The iOS app's version (CHANGELOG.md tracks it beside the app, web and
    # schema versions). Keep AppInfo.version in WalletWeatherKit equal to it.
    MARKETING_VERSION: "0.25.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # iPhone only for now (decided 2026-11-14): no iPad, no Mac.
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

packages:
  WalletWeatherKit:
    path: WalletWeatherKit

targets:
  WalletWeather:
    type: application
    platform: iOS
    sources:
      - path: WalletWeather
    dependencies:
      - package: WalletWeatherKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: WalletWeather
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # A second WalletWeather window, beside the first on the Duo's inner
        # screen (#90).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # All four: App Store Connect refuses an app with more than one
        # window (the Duo's side by side, above) without upside-down too.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # walletweather://: the sign-in sheet's answer and the "Open in
        # WalletWeather" button in the web app's Settings (WalletWeatherKit's AppLink).
        CFBundleURLTypes:
          - CFBundleURLName: net.iptater.walletweather
            CFBundleURLSchemes: [walletweather]
        # Plain http:// for home-network addresses only (ServerAddress):
        # iOS's own local-networking exception, nothing wider.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: WalletWeather connects to your WalletWeather server when it's on your home network.
        ITSAppUsesNonExemptEncryption: false
        # The app lock (#91), when turned on in More.
        NSFaceIDUsageDescription: "WalletWeather uses Face ID to unlock the app when you turn its lock on."
        # Scanning the web app's QR code to sign in (#100), only when chosen.
        # Sync with iCloud in the background (#238): CloudKit's silent pushes.
        UIBackgroundModes: [remote-notification]
        # The backups folder shows in the Files app under iCloud Drive (#237).
        NSUbiquitousContainers:
          iCloud.net.iptater.walletweather:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: WalletWeather
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSCameraUsageDescription: "WalletWeather uses the camera to scan the sign-in QR code from your WalletWeather server's Settings, only when you choose to."
    # iCloud Drive (#237): the backup of the household on this iPhone goes to
    # this container's Backups folder. Xcode registers the container with the
    # team the first time it signs the app with this capability.
    entitlements:
      path: WalletWeather/WalletWeather.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.net.iptater.walletweather]
        com.apple.developer.icloud-services: [CloudDocuments, CloudKit]
        # Sync with iCloud (#238): CloudKit's silent pushes, also in the background.
        aps-environment: development
        com.apple.developer.ubiquity-container-identifiers: [iCloud.net.iptater.walletweather]
    settings:
      base:
        # The bundle ID is what keeps the phone's Keychain sign-in: never change it.
        PRODUCT_BUNDLE_IDENTIFIER: net.iptater.walletweather
        PRODUCT_NAME: WalletWeather
        # The app icon (#156), with dark and tinted versions.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
