# Throwaway demo stack for web-refresh screenshots (Plans/web-refresh.md): sample data only,
# its own Compose project, volume and port, so it never touches a real database.
#
#   cd Plans/web-refresh
#   python3 -c "import base64,secrets;print(f'DB_PASSWORD={secrets.token_urlsafe(18)}\nSESSION_SECRET={secrets.token_urlsafe(48)}\nENCRYPTION_KEY={base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()}')" > .env
#   docker compose -p ww-web-refresh -f demo-compose.yml up -d --build
#   python3 capture.py /path/outside/the/repo/shots
#   docker compose -p ww-web-refresh -f demo-compose.yml down
#
# .env here is gitignored (the repo ignores every .env). For Before pictures, build from the
# commit the phase started on (git archive <commit> apps packages | tar -x -C <folder>, and
# point `context` at that folder).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: walletweather
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: walletweather
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletweather -d walletweather"]
      interval: 3s
      timeout: 5s
      retries: 20
  web:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://walletweather:${DB_PASSWORD}@db:5432/walletweather
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_BASE_URL: http://localhost:8377
      DEMO_MODE: "true"
      BACKUP_DIR: /tmp/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/version', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:8377:8000"
volumes:
  db_data:
