# Runs the API tests against a throwaway PostgreSQL that lives only in memory
# (tmpfs), so nothing touches the app's real database or volumes:
#   docker compose -f docker-compose.test.yml run --rm tests
#   docker compose -f docker-compose.test.yml down
# Extra arguments go to pytest, e.g. `... run --rm tests -k auth`.
name: walletweather-test

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: walletweather
      POSTGRES_PASSWORD: walletweather
      POSTGRES_DB: walletweather_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletweather -d walletweather_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  tests:
    image: python:3.12-slim
    depends_on:
      test-db:
        condition: service_healthy
    working_dir: /src/apps/server
    volumes:
      - ./apps/server:/src/apps/server
      # The web client too, read-only: the server serves /sw.js and the icons
      # from it, and the tests check those routes.
      - ./apps/web:/src/apps/web:ro
      # The shared JavaScript core and its answer key (#232). Writable so
      # WRITE_ANSWER_KEY=1 can rewrite the key (see tests/answer_key.py).
      - ./packages/core:/src/packages/core
      # The iPhone app's copy of the core, read-only, to check it matches (#234).
      - ./apps/ios/WalletWeatherKit/Sources/WalletWeatherKit/Core:/src/apps/ios/WalletWeatherKit/Sources/WalletWeatherKit/Core:ro
      # The backups that move between a server and the iPhone (#236). Writable
      # so WRITE_BACKUP_FIXTURES=1 can rewrite from-server.json (see
      # tests/test_backup_moves.py).
      - ./apps/ios/WalletWeatherKit/Tests/WalletWeatherKitTests/Samples/moves:/src/apps/ios/WalletWeatherKit/Tests/WalletWeatherKitTests/Samples/moves
      # And the settings files, read-only: test_settings_wiring.py checks that
      # every setting the server reads is passed through and documented (#200).
      - ./docker-compose.yml:/src/docker-compose.yml:ro
      - ./.env.example:/src/.env.example:ro
      - test_pip_cache:/root/.cache/pip
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://walletweather:walletweather@test-db:5432/walletweather_test
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["sh", "-c", "pip install -q --disable-pip-version-check --root-user-action=ignore -r requirements-dev.txt && exec pytest \"$@\"", "--"]

volumes:
  test_pip_cache:
