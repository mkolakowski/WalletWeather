name: Tests

# Runs the API tests on every pull request and every push to main. It only
# tests: images are built and published by build-and-push.yml on a release.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/ios/**'
      - 'apps/android/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: walletweather
          POSTGRES_PASSWORD: walletweather
          POSTGRES_DB: walletweather_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walletweather -d walletweather_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/server/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://walletweather:walletweather@localhost:5432/walletweather_test
        run: pytest

  # Fails when a pinned package, or anything it pulls in, has a published
  # security advisory (security-fixes phase 5, #188). When it fails on a
  # change that didn't touch requirements.txt, a new advisory came out:
  # run /cve-scan to see whether it applies, then update the package.
  advisories:
    name: Known advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check requirements.txt against the advisory databases
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt
