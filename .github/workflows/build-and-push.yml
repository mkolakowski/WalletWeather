name: Build and push to GHCR

# Images are built when a version is released, not on every merge, so
# `latest` always points at the newest release. Start it by hand from the
# Actions tab for a one-off build.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The web client's version (WEB_VERSION in backend/static/index.html),
      # used as an image tag so every build is pullable by that version.
      - name: Read web client version
        id: webver
        run: |
          version=$(sed -n 's/^const WEB_VERSION = "\([^"]*\)";.*/\1/p' backend/static/index.html)
          if [ -z "$version" ]; then
            echo "::error file=backend/static/index.html::WEB_VERSION not found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is set below, for a full release only: never for a
          # pre-release or a build started by hand.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ steps.webver.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
